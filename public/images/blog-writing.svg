<svg width="420" height="260" viewBox="0 0 420 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f9fafb;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="420" height="260" fill="url(#blogBg)"/>

  <!-- Desk surface -->
  <rect x="0" y="200" width="420" height="60" fill="#8b4513"/>
  <rect x="0" y="190" width="420" height="20" fill="#654321"/>

  <!-- Open book/notebook -->
  <rect x="80" y="120" width="120" height="80" fill="url(#paperGrad)" rx="4"/>
  <rect x="85" y="125" width="110" height="70" fill="#ffffff" rx="2"/>
  <line x1="85" y1="145" x2="195" y2="145" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="85" y1="155" x2="180" y2="155" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="85" y1="165" x2="195" y2="165" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="85" y1="175" x2="160" y2="175" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="85" y1="185" x2="190" y2="185" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Writing hand/pen -->
  <path d="M 150 160 Q 155 155 160 160 Q 165 165 160 170 Q 155 175 150 170 Z" fill="#d1d5db"/>
  <rect x="155" y="155" width="25" height="3" fill="#374151" rx="1"/>
  <circle cx="182" cy="156.5" r="1.5" fill="#dc2626"/>

  <!-- Coffee mug -->
  <ellipse cx="280" cy="170" rx="15" ry="10" fill="#6b7280"/>
  <rect x="265" y="160" width="30" height="18" fill="none" stroke="#6b7280" stroke-width="2" rx="2"/>
  <text x="280" y="172" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="8">☕</text>

  <!-- Lamp -->
  <rect x="350" y="140" width="8" height="40" fill="#374151"/>
  <ellipse cx="354" cy="135" rx="15" ry="8" fill="#fbbf24" opacity="0.7"/>
  <circle cx="354" cy="135" r="8" fill="#f59e0b"/>

  <!-- Floating elements -->
  <circle cx="50" cy="60" r="6" fill="#3b82f6" opacity="0.5"/>
  <circle cx="350" cy="50" r="4" fill="#ef4444" opacity="0.6"/>
  <circle cx="200" cy="40" r="5" fill="#10b981" opacity="0.4"/>
  <circle cx="120" cy="70" r="3" fill="#8b5cf6" opacity="0.5"/>

  <!-- Light rays from lamp -->
  <line x1="354" y1="135" x2="320" y2="100" stroke="#fbbf24" stroke-width="1" opacity="0.3"/>
  <line x1="354" y1="135" x2="388" y2="100" stroke="#fbbf24" stroke-width="1" opacity="0.3"/>
  <line x1="354" y1="135" x2="354" y2="90" stroke="#fbbf24" stroke-width="1" opacity="0.3"/>

  <!-- Title overlay -->
  <rect x="0" y="0" width="420" height="80" fill="rgba(0,0,0,0.1)"/>
  <text x="210" y="30" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Publishing Insights & Tips</text>
  <text x="210" y="50" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="10">Expert advice for aspiring authors</text>
</svg>