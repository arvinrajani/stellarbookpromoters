<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="serviceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ecfdf5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1fae5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#serviceBg)"/>

  <!-- Central service icon -->
  <circle cx="200" cy="120" r="40" fill="url(#iconGrad)"/>
  <circle cx="200" cy="120" r="30" fill="white"/>
  <text x="200" y="130" text-anchor="middle" fill="#059669" font-family="Arial, sans-serif" font-size="24" font-weight="bold">✨</text>

  <!-- Service elements around center -->
  <!-- Top -->
  <circle cx="200" cy="60" r="15" fill="#3b82f6" opacity="0.8"/>
  <text x="200" y="66" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">EDIT</text>

  <!-- Right -->
  <circle cx="280" cy="120" r="15" fill="#f59e0b" opacity="0.8"/>
  <text x="280" y="126" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8" font-weight="bold">DESIGN</text>

  <!-- Bottom -->
  <circle cx="200" cy="180" r="15" fill="#ef4444" opacity="0.8"/>
  <text x="200" y="186" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8" font-weight="bold">MARKET</text>

  <!-- Left -->
  <circle cx="120" cy="120" r="15" fill="#8b5cf6" opacity="0.8"/>
  <text x="120" y="126" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8" font-weight="bold">PUBLISH</text>

  <!-- Connecting lines -->
  <line x1="200" y1="80" x2="200" y2="105" stroke="#059669" stroke-width="2" opacity="0.5"/>
  <line x1="235" y1="120" x2="265" y2="120" stroke="#059669" stroke-width="2" opacity="0.5"/>
  <line x1="200" y1="150" x2="200" y2="165" stroke="#059669" stroke-width="2" opacity="0.5"/>
  <line x1="135" y1="120" x2="165" y2="120" stroke="#059669" stroke-width="2" opacity="0.5"/>

  <!-- Floating particles -->
  <circle cx="80" cy="80" r="3" fill="#10b981" opacity="0.6"/>
  <circle cx="320" cy="70" r="4" fill="#3b82f6" opacity="0.5"/>
  <circle cx="60" cy="200" r="2" fill="#f59e0b" opacity="0.7"/>
  <circle cx="340" cy="190" r="3" fill="#ef4444" opacity="0.5"/>
  <circle cx="150" cy="40" r="2" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="250" cy="230" r="3" fill="#059669" opacity="0.4"/>

  <!-- Title overlay -->
  <rect x="0" y="220" width="400" height="80" fill="rgba(255,255,255,0.9)"/>
  <text x="200" y="245" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Complete Publishing Services</text>
  <text x="200" y="265" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="10">From manuscript to market success</text>
</svg>