<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#heroGrad)"/>

  <!-- Floating books -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="80" height="100" fill="url(#bookGrad)" rx="4" opacity="0.9"/>
    <rect x="10" y="10" width="60" height="80" fill="#fef3c7" rx="2"/>
    <line x1="15" y1="20" x2="65" y2="20" stroke="#d97706" stroke-width="1"/>
    <line x1="15" y1="30" x2="65" y2="30" stroke="#d97706" stroke-width="1"/>
    <line x1="15" y1="40" x2="50" y2="40" stroke="#d97706" stroke-width="1"/>
  </g>

  <g transform="translate(200, 60)">
    <rect x="0" y="0" width="70" height="90" fill="#10b981" rx="4" opacity="0.8"/>
    <rect x="8" y="8" width="54" height="74" fill="#ecfdf5" rx="2"/>
    <circle cx="35" cy="35" r="15" fill="#059669" opacity="0.7"/>
    <text x="35" y="40" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">★</text>
  </g>

  <g transform="translate(320, 90)">
    <rect x="0" y="0" width="60" height="80" fill="#ef4444" rx="4" opacity="0.85"/>
    <rect x="6" y="6" width="48" height="68" fill="#fef2f2" rx="2"/>
    <text x="30" y="35" text-anchor="middle" fill="#dc2626" font-family="Arial, sans-serif" font-size="8" font-weight="bold">THRILLER</text>
  </g>

  <!-- Floating elements -->
  <circle cx="100" cy="50" r="8" fill="#fbbf24" opacity="0.6"/>
  <circle cx="300" cy="40" r="6" fill="#f97316" opacity="0.5"/>
  <circle cx="150" cy="200" r="10" fill="#8b5cf6" opacity="0.4"/>

  <!-- Title overlay -->
  <rect x="0" y="200" width="400" height="100" fill="rgba(0,0,0,0.3)"/>
  <text x="200" y="240" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Your Publishing Journey Starts Here</text>
  <text x="200" y="265" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" opacity="0.9">Professional editing, design, and marketing services</text>
</svg>